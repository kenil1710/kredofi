[package]
name = "kredofi-scorer"
description = "KredoFi TEE scorer (OutLayer, wasm32-wasip2): Plaid fetch, open scoring rules, sealed identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
name = "kredofi_scorer"
path = "src/lib.rs"

[[bin]]
name = "kredofi_scorer"
path = "src/main.rs"

[features]
# Local / testnet Dev only. The OutLayer build (pinned by version_key) uses neither.
demo = ["scoped"]   # accept {"op":"score","profile":{...}} (Plaid sandbox custom user) and plain tokens
scoped = []          # testnet: scope the sandbox identity to the account (SPEC 8c)
testnet-outlayer = ["scoped"]   # testnet on OutLayer: scoped identity only (one output line, sealed tokens)
debug = []  # accept "debug": true and print features to stderr

[dependencies]
serde_json = "1"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
base64 = "0.22"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2.1"

# wasi-http-client 0.2.1 crashes or hangs on request bodies over 4 KB.
# vendor/ = the crates.io 0.2.1 source patched by scripts/fix_http.py (same patch tested in prep).
[patch.crates-io]
wasi-http-client = { path = "vendor/wasi-http-client" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
