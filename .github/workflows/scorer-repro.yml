# Canonical scorer build: x86_64 Linux in the pinned Rust image (scorer/build-docker.sh). The bytes
# depend on the build host's OS and CPU (same source, same rustc: macOS arm64, Linux arm64 and Linux
# x86_64 each give their own hash), so the pinned versions are built here. Anyone can re-run this in a
# fork and compare the printed SHA-256 with the pinned version.
name: scorer reproducible build
on:
  workflow_dispatch:
  push:
    paths: ["scorer/**", "rust-toolchain.toml", ".github/workflows/scorer-repro.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: production build
        run: ./scorer/build-docker.sh && sha256sum scorer/out/kredofi_scorer.wasm
      - name: testnet demo build
        run: ./scorer/build-docker.sh demo && sha256sum scorer/out/kredofi_scorer_demo.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: scorer-wasm
          path: scorer/out/*.wasm
