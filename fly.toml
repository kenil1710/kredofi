# Fly.io app config (docs/DEPLOY.md). One always-on machine: rate limits and the ledger cache live
# in memory and on the /data volume, so do not scale past one machine.
app = "kredofi"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "kredofi_data"
  destination = "/data"
